<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pasta League — Table · Matches · Statistics · Guides</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- HERO IMAGE (top center) -->
  <div class="hero-top">
    <img src="gallery/logo.jpeg" alt="Pasta League Logo" class="hero-image" />
  </div>

  <main class="container">
    <!-- Standings / Table Section -->
    <section id="table-section" class="card">
      <h2>Table</h2>
      <div class="table-wrapper">
        <table id="standings-table" class="standings" aria-describedby="legend">
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>PTS</th>
              <th>MP</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>GF</th>
              <th>GA</th>
              <th>GD</th>
            </tr>
          </thead>
          <tbody>
            <!-- rows injected by JS -->
          </tbody>
        </table>
      </div>

      <div id="legend" class="legend" aria-hidden="false">
        <div><span class="legend-box semi"></span> Semi Final (1–2)</div>
        <div><span class="legend-box play"></span> Playoffs (3–6)</div>
      </div>
    </section>

    <!-- Matches Section -->
    <section id="matches-section" class="card">
      <h2>Matches</h2>
      <div class="matches-controls">
        <button id="matches-prev" class="btn" aria-label="Previous matchday">Prev</button>
        <div id="matches-title" class="matches-title">Matchday —</div>
        <button id="matches-next" class="btn" aria-label="Next matchday">Next</button>
      </div>

      <div id="matches-slide" class="matches-slide" role="list"></div>
    </section>

    <!-- Statistics Section -->
    <section id="stats-section" class="card">
      <h2>Statistics</h2>
      <div class="stats-controls">
        <button id="stats-btn-scorers" class="btn stat-toggle active">Top Scorers</button>
        <button id="stats-btn-conceded" class="btn stat-toggle">Goals Conceded</button>
      </div>

      <div id="stats-area" class="stats-area"></div>
    </section>

    <!-- Guides Section (single card view with prev/next) -->
    <section id="guides-section" class="card">
      <h2>Guides</h2>

      <div class="guides-controls">
        <button id="guides-prev" class="btn" aria-label="Previous guide">Prev</button>
        <div id="guides-title" class="guides-title">Guides</div>
        <button id="guides-next" class="btn" aria-label="Next guide">Next</button>
      </div>

      <!-- Only one visible guide card at a time -->
      <div id="guides-single" class="guides-single">
        <!-- single guide card injected here (title only) -->
      </div>
    </section>
  </main>

  <!-- Player Modal -->
  <div id="player-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-player-name">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <h3 id="modal-player-name"></h3>
      <div class="modal-content">
        <img id="modal-player-image" alt="" />
        <div id="modal-player-description" class="player-description"></div>
      </div>
    </div>
  </div>

  <!-- Guide Modal (scrollable full-text, no prev/next) -->
  <div id="guide-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" id="guide-modal-backdrop"></div>
    <div class="modal-panel guide-panel" role="dialog" aria-modal="true" aria-labelledby="guide-modal-title">
      <button id="guide-modal-close" class="modal-close" aria-label="Close">&times;</button>
      <h3 id="guide-modal-title"></h3>
      <div id="guide-slides-container" class="guide-slides-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
