<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pasta League</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- TOP LOGO -->
  <div class="hero-top">
    <img src="gallery/logo.jpeg" class="hero-image" alt="Pasta League Logo" />
  </div>

  <main class="container">

    <!-- STANDINGS TABLE -->
    <section id="table-section" class="card">
      <h2>Table</h2>
      <div class="table-wrapper">
        <table id="standings-table" class="standings" aria-describedby="legend">
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>MP</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>GF</th>
              <th>GA</th>
              <th>GD</th>
              <th>PTS</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Legend -->
      <div id="legend" class="legend">
        <div><span class="legend-box semi"></span> Top 2 — Semi-finals</div>
        <div><span class="legend-box play"></span> Places 3–6 — Playoffs</div>
      </div>
    </section>

    <!-- MATCHES -->
    <section id="matches-section" class="card">
      <h2>Matches</h2>

      <div class="matches-controls">
        <button id="matches-prev" class="btn">Prev</button>
        <div id="matches-title" class="matches-title">Matchday —</div>
        <button id="matches-next" class="btn">Next</button>
      </div>

      <div id="matches-slide" class="matches-slide" role="list"></div>
    </section>

    <!-- STATS -->
    <section id="stats-section" class="card">
      <h2>Statistics</h2>
      <div class="stats-controls">
        <button id="stats-btn-scorers" class="btn stat-toggle active">Top Scorers</button>
        <button id="stats-btn-conceded" class="btn stat-toggle">Goals Conceded</button>
      </div>
      <div id="stats-area"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
